<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>통근버스 실시간 위치</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --surface: #f8f9fb;
    --text-main: #191f28;
    --text-sub: #4e5968;
    --text-muted: #8b95a1;
    --border: #e5e8eb;
    --primary: #3182f6;
    --primary-dark: #1b64da;
    --primary-soft: #e8f3ff;
    --back-accent: #0ca678;
    --back-soft: #e6fcf5;
    --success: #00b06b;
    --success-soft: #e5f8f0;
    --danger: #f04452;
    --danger-soft: #ffeeef;
    --warn: #f59f00;
    --warn-soft: #fff8e6;
    --radius-xl: 20px;
    --radius-lg: 16px;
    --radius-md: 12px;
    --shadow-sm: 0 2px 8px rgba(16, 24, 40, 0.06);
    --shadow-md: 0 6px 20px rgba(16, 24, 40, 0.10);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* 상단 헤더 */
  .app-header {
    background: var(--card);
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .title-group {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .bus-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }

  body.dir-back .bus-icon-box {
    background: var(--back-soft);
    color: var(--back-accent);
  }

  .title-text-wrap {
    display: flex;
    flex-direction: column;
  }

  .app-title {
    margin: 0;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .app-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 2px;
  }

  /* 출근 / 퇴근 세그먼트 */
  .dir-toggle {
    display: flex;
    background: var(--bg);
    padding: 3px;
    border-radius: 11px;
    border: 1px solid var(--border);
  }

  .dir-btn {
    border: none;
    background: transparent;
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .dir-btn.active {
    background: var(--card);
    color: var(--primary);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }

  body.dir-back .dir-btn.active {
    color: var(--back-accent);
  }

  /* 뷰 전환 탭 (지도 / 노선·시간표) */
  .view-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
    background: var(--bg);
    padding: 3px;
    border-radius: 11px;
  }

  .view-tab-btn {
    border: none;
    background: transparent;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-sub);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.18s ease;
  }

  .view-tab-btn.active {
    background: var(--card);
    color: var(--text-main);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
  }

  /* 메인 콘텐츠 영역 */
  .main-stage {
    position: relative;
    flex: 1;
    width: 100%;
    min-height: 220px;
    overflow: hidden;
  }

  /* 지도 뷰 */
  .map-view {
    position: absolute;
    inset: 0;
    display: block;
  }

  #map {
    width: 100%;
    height: 100%;
    z-index: 1;
    background: #eef2f6;
  }

  /* OSM 타일 톤을 부드럽고 현대적으로 보정 */
  .leaflet-tile-pane {
    filter: saturate(0.84) contrast(0.97) brightness(1.02);
  }

  /* 지도 위 플로팅 알림 배너 */
  .top-banner {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 700;
    background: rgba(25, 31, 40, 0.92);
    color: #fff;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 12.5px;
    line-height: 1.4;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    backdrop-filter: blur(8px);
    box-shadow: var(--shadow-md);
  }

  .top-banner.show { display: flex; }
  .top-banner.warn { background: rgba(240, 68, 82, 0.95); }

  .banner-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    padding: 2px 4px;
    opacity: 0.85;
  }

  /* 지도 우측 플로팅 버튼 그룹 */
  .map-fab-group {
    position: absolute;
    right: 14px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 500;
  }

  .map-fab {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-main);
    transition: transform 0.12s ease, background 0.15s ease;
  }

  .map-fab:active {
    transform: scale(0.94);
    background: var(--bg);
  }

  /* 노선도 / 시간표 뷰 */
  .route-view {
    position: absolute;
    inset: 0;
    background: var(--bg);
    overflow-y: auto;
    padding: 14px 14px 24px;
    display: none;
    z-index: 600;
    -webkit-overflow-scrolling: touch;
  }

  .route-view.active {
    display: block;
  }

  .route-summary-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .route-summary-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
  }

  .route-summary-desc {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 3px;
  }

  .route-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 8px;
    background: var(--primary-soft);
    color: var(--primary);
    white-space: nowrap;
  }

  body.dir-back .route-badge {
    background: var(--back-soft);
    color: var(--back-accent);
  }

  .timeline-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 8px 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  .stop-row {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 4px;
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.15s ease;
  }

  .stop-row:active {
    background: var(--surface);
  }

  .stop-row:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 16px;
    top: 30px;
    bottom: -14px;
    width: 2.5px;
    background: #d9e2ec;
    z-index: 1;
  }

  .stop-row.passed:not(:last-child)::after {
    background: var(--primary);
    opacity: 0.35;
  }

  body.dir-back .stop-row.passed:not(:last-child)::after {
    background: var(--back-accent);
  }

  .stop-node {
    position: relative;
    z-index: 2;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--card);
    border: 2.5px solid var(--primary);
    color: var(--primary);
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  body.dir-back .stop-node {
    border-color: var(--back-accent);
    color: var(--back-accent);
  }

  .stop-node.terminal {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  body.dir-back .stop-node.terminal {
    background: var(--back-accent);
    border-color: var(--back-accent);
  }

  .stop-row.near-bus .stop-node {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
    box-shadow: 0 0 0 5px var(--success-soft);
  }

  .stop-info {
    flex: 1;
    min-width: 0;
  }

  .stop-name-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .stop-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-main);
  }

  .stop-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--bg);
    color: var(--text-sub);
  }

  .stop-tag.live-here {
    background: var(--success-soft);
    color: var(--success);
  }

  .stop-spot {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 3px;
  }

  .stop-times {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }

  .time-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-sub);
  }

  .time-chip strong {
    color: var(--text-main);
    font-weight: 700;
  }

  .stop-map-hint {
    font-size: 11px;
    color: var(--text-muted);
    align-self: center;
    padding-left: 4px;
    flex-shrink: 0;
  }

  /* 하단 상태 및 컨트롤 시트 */
  .bottom-sheet {
    background: var(--card);
    border-top: 1px solid var(--border);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 14px 16px 16px;
    box-shadow: 0 -6px 24px rgba(16, 24, 40, 0.06);
    z-index: 1000;
    flex-shrink: 0;
  }

  .status-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 11px 13px;
    border-radius: var(--radius-md);
    margin-bottom: 10px;
    gap: 10px;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  .pulse-dot.live {
    background: var(--success);
    box-shadow: 0 0 0 4px var(--success-soft);
    animation: pulse 1.8s infinite;
  }

  .pulse-dot.stale {
    background: var(--warn);
    box-shadow: 0 0 0 4px var(--warn-soft);
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 176, 107, 0.45); }
    70% { box-shadow: 0 0 0 8px rgba(0, 176, 107, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 176, 107, 0); }
  }

  .status-texts {
    min-width: 0;
  }

  .status-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-sub {
    font-size: 11.5px;
    color: var(--text-sub);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 7px;
    background: #e5e8eb;
    color: var(--text-sub);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .status-pill.live {
    background: var(--success-soft);
    color: var(--success);
  }

  .status-pill.stale {
    background: var(--warn-soft);
    color: #b27000;
  }

  .action-btn {
    width: 100%;
    padding: 13px 16px;
    border: none;
    border-radius: var(--radius-md);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform 0.1s ease, background 0.15s ease;
    box-shadow: 0 4px 12px rgba(49, 130, 246, 0.25);
  }

  body.dir-back .action-btn:not(.sharing):not(:disabled) {
    background: var(--back-accent);
    box-shadow: 0 4px 12px rgba(12, 166, 120, 0.25);
  }

  .action-btn:active { transform: scale(0.99); }

  .action-btn.sharing {
    background: var(--danger);
    box-shadow: 0 4px 12px rgba(240, 68, 82, 0.25);
  }

  .action-btn:disabled {
    background: #cbd2d9;
    box-shadow: none;
    cursor: not-allowed;
  }

  .helper-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 7px;
    text-align: center;
    line-height: 1.4;
  }

  .ios-notice {
    display: none;
    margin-top: 8px;
    padding: 8px 10px;
    background: var(--warn-soft);
    color: #8a5300;
    border-radius: 8px;
    font-size: 11.5px;
    line-height: 1.4;
  }

  /* 커스텀 Leaflet 버스 마커 */
  .bus-marker-wrap {
    position: relative;
    transform: translate(-50%, -50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .bus-marker-halo {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(49, 130, 246, 0.22);
    animation: busHalo 2s infinite;
  }

  body.dir-back .bus-marker-halo {
    background: rgba(12, 166, 120, 0.22);
  }

  @keyframes busHalo {
    0% { transform: scale(0.7); opacity: 0.9; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  .bus-marker-pin {
    position: relative;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 2.5px solid #fff;
    box-shadow: 0 4px 14px rgba(25, 31, 40, 0.32);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .bus-marker-pin.back {
    background: var(--back-accent);
  }

  .bus-marker-pin.stale {
    background: #8b95a1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
  }

  /* 커스텀 Leaflet 정류장 마커 */
  .stop-pin {
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
  }

  .stop-pin-circle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffffff;
    border: 2.5px solid var(--primary);
    color: var(--primary);
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(16, 24, 40, 0.24);
  }

  body.dir-back .stop-pin-circle {
    border-color: var(--back-accent);
    color: var(--back-accent);
  }

  .stop-pin-circle.terminal {
    width: 24px;
    height: 24px;
    background: var(--primary);
    color: #ffffff;
    border: 2.5px solid #ffffff;
    font-size: 10.5px;
  }

  body.dir-back .stop-pin-circle.terminal {
    background: var(--back-accent);
  }

  .stop-pin-label {
    margin-top: 3px;
    background: rgba(255, 255, 255, 0.94);
    color: var(--text-main);
    border: 1px solid rgba(25, 31, 40, 0.12);
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(16, 24, 40, 0.12);
  }

  .stop-pin-label.terminal {
    background: var(--text-main);
    color: #ffffff;
    border-color: transparent;
  }

  /* 줌 아웃 시 중간 정류장 라벨 숨김으로 겹침 방지 */
  #map.zoom-low .stop-pin-label.minor {
    display: none;
  }

  /* Leaflet 팝업 커스텀 디자인 */
  .leaflet-popup-content-wrapper {
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    padding: 2px;
  }

  .leaflet-popup-content {
    margin: 10px 12px;
    font-family: inherit;
    min-width: 190px;
  }

  .popup-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .popup-order {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 10.5px;
    font-weight: 800;
  }

  .popup-spot {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 5px;
    line-height: 1.4;
  }

  .popup-times {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-main);
    line-height: 1.5;
  }
</style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="header-top">
      <div class="title-group">
        <div class="bus-icon-box" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>
          </svg>
        </div>
        <div class="title-text-wrap">
          <h1 class="app-title">통근버스 위치</h1>
          <span class="app-subtitle" id="routeSubtitle">배곧 롯데마트 → 발전소(영흥순대국)</span>
        </div>
      </div>

      <div class="dir-toggle" role="group" aria-label="운행 방향">
        <button type="button" class="dir-btn active" id="btnDirOut">출근행</button>
        <button type="button" class="dir-btn" id="btnDirBack">퇴근행</button>
      </div>
    </div>

    <div class="view-tabs" role="tablist">
      <button type="button" class="view-tab-btn active" id="tabMap" role="tab" aria-selected="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
        실시간 지도
      </button>
      <button type="button" class="view-tab-btn" id="tabRoute" role="tab" aria-selected="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
        정류소 · 시간표
      </button>
    </div>
  </header>

  <!-- 메인 스테이지 (지도 뷰 + 노선도 뷰) -->
  <main class="main-stage">
    <div id="topBanner" class="top-banner" role="alert">
      <span id="bannerText"></span>

function getOrderedStops(dir) {
  return dir === "back" ? [...BUS_STOPS].reverse() : [...BUS_STOPS];
}

function getDistanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLng = (lng2 - lng1) * rad * Math.cos(((lat1 + lat2) / 2) * rad);
  return Math.sqrt(dLat * dLat + dLng * dLng) * R;
}

function formatDistance(meters) {
  if (meters < 1000) return `${Math.round(meters / 10) * 10}m`; return `${(meters / 1000).toFixed(1)}km`;
}

function detectDirectionByTime() {
  const hour = new Date().getHours();
  return hour < 12 ? "out" : "back";
}

function detectSmartDirection(lat, lng) {
  const distToStart = getDistanceMeters(lat, lng, START_TERMINAL[0], START_TERMINAL[1]);
  const distToEnd = getDistanceMeters(lat, lng, END_TERMINAL[0], END_TERMINAL[1]);
  if (distToStart < 3000 && distToStart < distToEnd) return "out";
  if (distToEnd < 3000 && distToEnd < distToStart) return "back";
  return detectDirectionByTime();
}

function getDestinationPoint(dir) {
  return dir === "back" ? START_TERMINAL : END_TERMINAL;
}

function findNearestStop(lat, lng, dir) {
  const stops = getOrderedStops(dir);
  let nearestIdx = 0;
  let minDist = Infinity;
  stops.forEach((s, idx) => {
    const d = getDistanceMeters(lat, lng, s.lat, s.lng);
    if (d < minDist) {
      minDist = d;
      nearestIdx = idx;
    }
  });
  return { stop: stops[nearestIdx], index: nearestIdx, distanceM: minDist, nextStop: stops[nearestIdx + 1] || null };
}

function renderMapStops() {

  const ordered = getOrderedStops(currentDirection);

  guidePolyline = L.polyline(coords, {
    color: currentDirection === "back" ? "#0ca678" : "#3182f6",

  ordered.forEach((stop, idx) => {

    const icon = L.divIcon({

    const marker = L.marker([stop.lat, stop.lng], {

      zIndexOffset: isTerm ? 10 : -50

    const spotText = currentDirection === "back" ? stop.backSpot : stop.outSpot;
    const timesHtml = currentDirection === "back"

      : `<div>오전(주간/일근): <strong>${stop.outTimes.am}</strong></div><div>오후(야간): <strong>${stop.outTimes.pm}</strong></div>`;

    const popupHtml = `

      <div class="popup-spot">📍 ${spotText}</div>

    marker.bindPopup(popupHtml);
    stopMarkerMap[stop.id] = marker;
  });

  updateZoomClass();
}

function renderRouteTimeline() {

  const isBack = currentDirection === "back";

  document.getElementById("routeSummaryTitle").textContent = isBack

         <span class="time-chip">통상 <strong>${stop.backRegular.monThu}</strong> (금 <strong>${stop.backRegular.fri}</strong>
